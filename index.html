:root{
  --bg:#FFFFFF; --bg-warm:#FAFAF6; --surface-1:#F5F5F1; --surface-2:#EEEEE8; --surface-3:#E6E6DE;
  --line-1:rgba(10,10,10,0.07); --line-2:rgba(10,10,10,0.12); --line-3:rgba(10,10,10,0.20);
  --ink-1:#0A0A0A; --ink-2:rgba(10,10,10,0.64); --ink-3:rgba(10,10,10,0.42); --ink-4:rgba(10,10,10,0.26);
  --lime:#4E9A12; --lime-deep:#2F6B0E; --lime-soft:#E4F1D2; --lime-card:#AED67F; --lime-glow:rgba(78,154,18,0.45);
  --phone-bg:#FFFFFF; --phone-surf:#F5F5F2; --phone-text-1:#0A0A0A; --phone-text-2:#8A8A86; --phone-text-3:#B6B6B0; --phone-line-1:#ECECE7;
  --font-body:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --radius-sm:8px; --radius:12px; --radius-lg:20px; --radius-xl:28px;
  --ease-silky:cubic-bezier(0.16,1,0.3,1); --ease-swift:cubic-bezier(0.4,0,0.2,1);
  --ng-bg:#0A0A0A; --ng-on:#FFFFFF; --ng-on-2:rgba(255,255,255,0.66); --ng-on-3:rgba(255,255,255,0.40); --ng-line:rgba(255,255,255,0.12); --ng-surf:rgba(255,255,255,0.045); --ng-surf-2:rgba(255,255,255,0.07);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink-1)}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-feature-settings:"ss01","cv01";-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow-x:hidden}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;letter-spacing:inherit}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--ink-1);outline-offset:3px;border-radius:4px}
::selection{background:var(--lime);color:#fff}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(10,10,10,0.12);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(10,10,10,0.22)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-family:var(--font-mono);font-feature-settings:"tnum"}
.mesh-base{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60vw 60vw at 88% -8%, rgba(78,154,18,0.16), transparent 55%),radial-gradient(50vw 50vw at -8% 18%, rgba(78,154,18,0.10), transparent 60%),radial-gradient(70vw 45vw at 50% 112%, rgba(78,154,18,0.08), transparent 55%)}
.mesh-orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;opacity:0.5}
.mesh-orb.a{width:460px;height:460px;top:-140px;right:-80px;background:radial-gradient(circle, rgba(78,154,18,0.6) 0%, rgba(78,154,18,0) 70%);animation:orbA 20s ease-in-out infinite alternate}
.mesh-orb.b{width:380px;height:380px;top:34vh;left:-150px;background:radial-gradient(circle, rgba(78,154,18,0.4) 0%, rgba(78,154,18,0) 70%);animation:orbB 24s ease-in-out infinite alternate}
@keyframes orbA{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-70px,50px) scale(1.12)}}
@keyframes orbB{0%{transform:translate(0,0) scale(1)}100%{transform:translate(100px,-30px) scale(0.92)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0.035;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.spotlight{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(300px 300px at var(--mx,50%) var(--my,30%), rgba(78,154,18,0.10), transparent 70%);transition:background 80ms linear}
#root{position:relative;z-index:2}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.18em;color:var(--ink-3);display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:24px;height:3px;background:var(--lime);border-radius:1px}
.eyebrow.no-mark::before{display:none}
.dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--ink-4);vertical-align:middle}
.mark-hl{position:relative;display:inline-block}
.mark-hl>span{position:relative;z-index:1}
.mark-hl::after{content:"";position:absolute;left:-0.04em;right:-0.04em;bottom:0.1em;height:0.36em;background:var(--lime);z-index:0;border-radius:2px}
.phone-screen{background:var(--phone-bg);color:var(--phone-text-1);height:100%;display:flex;flex-direction:column}
.phone-status{padding:6px 16px 8px;display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:600;color:var(--phone-text-1)}
.phone-titlebar{padding:4px 14px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--phone-line-1)}
.mobile-step-nav{display:none}
.ng-work{display:grid;grid-template-columns:auto minmax(0,1fr);gap:56px;align-items:center}
.ng-extra-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line-2)}
.ng-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
@media (max-width:960px){
  .mobile-step-nav{display:inline-flex;align-items:center;gap:14px;padding:6px 6px;background:var(--bg);border:1px solid var(--line-2);border-radius:99px;box-shadow:0 8px 30px rgba(0,0,0,0.10)}
  .mobile-step-nav button{width:40px;height:40px;border-radius:50%;border:none;background:var(--surface-1);color:var(--ink-1);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s ease,color .2s ease,transform .15s ease;-webkit-tap-highlight-color:transparent}
  .mobile-step-nav button:not(:disabled):active{transform:scale(0.94)}
  .mobile-step-nav button:not(:disabled):hover{background:var(--ink-1);color:#fff}
  .mobile-step-nav button:disabled{opacity:.3;cursor:default}
  .mobile-step-nav .counter{font-size:14px;color:var(--ink-2);font-weight:600;letter-spacing:0.02em;min-width:60px;text-align:center}
}
@media (max-width:1100px){.hero-grid{grid-template-columns:1fr !important;gap:28px !important;align-items:start !important}}
@media (max-width:960px){
  .work-grid{grid-template-columns:1fr !important;gap:48px !important}
  .work-grid>*:first-child{display:flex;justify-content:center}
  .bento-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  .bento-grid>.b-large{grid-column:span 2 !important;grid-row:span 1 !important}
}
@media (max-width:720px){
  .hero{padding:72px 20px 40px !important}
  .section{padding-left:20px !important;padding-right:20px !important}
  .step-rail{display:flex !important;grid-template-columns:none !important;gap:10px !important;overflow-x:auto;padding-bottom:10px !important;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  .step-rail-item{flex:0 0 140px !important;min-width:140px !important;scroll-snap-align:start}
  .metrics-grid{grid-template-columns:1fr !important}
  .metrics-grid>.m-r{padding-left:0 !important;padding-top:24px !important;border-left:none !important;border-top:1px solid var(--line-2) !important}
  .bento-grid{grid-template-columns:1fr !important}
  .bento-grid>.b-large{grid-column:span 1 !important}
  h1.display{font-size:52px !important;letter-spacing:-0.04em !important}
}
@media (max-width:960px){
  .ng-work{grid-template-columns:1fr !important;gap:40px !important}
  .ng-work>*:first-child{display:flex;justify-content:center}
  .ng-extra-grid{grid-template-columns:1fr !important}
  .ng-metrics{grid-template-columns:1fr !important}
}
@media (max-width:720px){
  .ng{padding:64px 20px !important}
  .ng-pills{overflow-x:auto;flex-wrap:nowrap !important;-webkit-overflow-scrolling:touch}
  .ng-pills::-webkit-scrollbar{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important}}
